name: Build PVE Kernel

on:
  schedule:
    # Poll the normal Proxmox APT channel daily. The build is skipped unless
    # its newest published kernel version is not yet released in this repo.
    - cron: '22 03 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this version already released
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pve-arm64-kernel
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      build: ${{ steps.detect.outputs.build }}
      force: ${{ steps.detect.outputs.force }}
      pve_version: ${{ steps.detect.outputs.PVE_VERSION }}
      pve_head: ${{ steps.detect.outputs.PVE_HEAD }}
    steps:
      - name: Resolve published PVE kernel release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PVE_APT_URL="http://download.proxmox.com/debian/pve/dists/trixie/pve-no-subscription/binary-amd64/Packages.gz"
          PVE_GIT_URL="https://git.proxmox.com/git/pve-kernel.git"

          package=""
          version=""
          PVE_VERSION=""
          while IFS= read -r line || [ -n "${line}" ]; do
            case "${line}" in
              "Package: proxmox-kernel-"[0-9]*.[0-9]*)
                package="${line#Package: }"
                version=""
                ;;
              "Version: "*) version="${line#Version: }" ;;
              "")
                if [ -n "${version}" ] && [[ "${package}" =~ ^proxmox-kernel-[0-9]+\.[0-9]+$ ]] \
                  && { [ -z "${PVE_VERSION}" ] || dpkg --compare-versions "${version}" gt "${PVE_VERSION}"; }; then
                  PVE_VERSION="${version}"
                fi
                package=""
                version=""
                ;;
            esac
          done < <(curl --fail --silent --show-error "${PVE_APT_URL}" | gzip -dc)
          [ -n "${PVE_VERSION}" ] || {
            echo "FATAL: no published Proxmox kernel version found" >&2
            exit 1
          }
          PVE_VERSION="${PVE_VERSION}-pve"

          CLONE="${RUNNER_TEMP}/pve-lite"
          git clone --quiet --depth 1000 --no-tags "${PVE_GIT_URL}" "${CLONE}"
          PVE_HEAD=""
          for commit in $(git -C "${CLONE}" rev-list HEAD); do
            makefile="$(git -C "${CLONE}" show "${commit}:Makefile")" || continue
            kernel_maj="$(printf '%s\n' "${makefile}" | sed -n 's/^KERNEL_MAJ=//p')"
            kernel_min="$(printf '%s\n' "${makefile}" | sed -n 's/^KERNEL_MIN=//p')"
            kernel_patchlevel="$(printf '%s\n' "${makefile}" | sed -n 's/^KERNEL_PATCHLEVEL=//p')"
            krel="$(printf '%s\n' "${makefile}" | sed -n 's/^KREL=//p')"
            krel_extra="$(printf '%s\n' "${makefile}" | sed -n 's/^KREL_EXTRA=//p')"
            if [ "${kernel_maj}.${kernel_min}.${kernel_patchlevel}-${krel}${krel_extra}-pve" = "${PVE_VERSION}" ]; then
              PVE_HEAD="${commit}"
              break
            fi
          done
          [ -n "${PVE_HEAD}" ] || {
            echo "FATAL: no pve-kernel Git commit found for ${PVE_VERSION}" >&2
            exit 1
          }

          echo "::notice:: selected ${PVE_VERSION} from pve-no-subscription at ${PVE_HEAD}"
          echo "PVE_VERSION=${PVE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "PVE_HEAD=${PVE_HEAD}" >> "${GITHUB_OUTPUT}"
          FORCE="${{ inputs.force && '1' || '0' }}"
          echo "force=${FORCE}" >> "${GITHUB_OUTPUT}"
          tag_exists=0
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${PVE_VERSION}" >/dev/null 2>&1; then
            tag_exists=1
          fi
          published=0
          if release_state="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PVE_VERSION}" --jq '[.draft, .published_at] | @tsv' 2>/dev/null)"; then
            IFS=$'\t' read -r draft published_at <<<"${release_state}"
            if [ "${draft}" = false ] && [ "${published_at}" != null ]; then
              published=1
            fi
          fi
          if [ "${FORCE}" != "1" ] && [ "${tag_exists}" = "1" ] && [ "${published}" = "1" ]; then
            echo "::notice:: ${PVE_VERSION} tag and published release already exist; nothing to do."
            echo "build=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${tag_exists}" = "1" ]; then
            echo "::notice:: ${PVE_VERSION} tag exists without a published release; building to publish it."
          fi
          echo "build=true" >> "${GITHUB_OUTPUT}"

  preflight:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify PVE packaging patch
        env:
          PVE_HEAD: ${{ needs.resolve.outputs.pve_head }}
        run: |
          set -euo pipefail
          source="${RUNNER_TEMP}/pve-kernel"
          git clone --quiet --depth 1 --no-tags https://git.proxmox.com/git/pve-kernel.git "${source}"
          if [ "$(git -C "${source}" rev-parse HEAD)" != "${PVE_HEAD}" ]; then
            git -C "${source}" fetch --quiet --depth 1 origin "${PVE_HEAD}"
            git -C "${source}" checkout --quiet FETCH_HEAD
          fi
          git -C "${source}" apply --check "${GITHUB_WORKSPACE}/patches/pve/x96-max-plus-boot-deployment.patch"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      WORK_DIR: ${{ github.workspace }}/work
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build native ARM64 packages
        run: |
          docker run --rm \
            --platform linux/arm64 \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env WORK_DIR=/workspace/work \
            --env PVE_HEAD="${{ needs.resolve.outputs.pve_head }}" \
            debian:trixie \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq \
                build-essential ca-certificates devscripts dh-python equivs git patch python3 sphinx-common
              git config --global --add safe.directory /workspace
              bash tools/build-pve-kernel.sh
            '

      - name: Upload build artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pve-kernel-${{ needs.resolve.outputs.pve_version }}-arm64
          path: ${{ github.workspace }}/work/pve-kernel/proxmox-kernel-${{ needs.resolve.outputs.pve_version }}_*_arm64.deb
          if-no-files-found: warn
          retention-days: 14

  validate:
    needs: [resolve, build]
    if: ${{ needs.resolve.outputs.build == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download kernel package
        uses: actions/download-artifact@v8
        with:
          name: pve-kernel-${{ needs.resolve.outputs.pve_version }}-arm64
          path: kernel

      - name: Validate raw ARM64 Image
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(kernel/proxmox-kernel-[0-9]*_arm64.deb)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "FATAL: expected one ARM64 proxmox-kernel package" >&2
            exit 1
          fi
          contents="$(mktemp)"
          trap 'rm -f "${contents}"' EXIT
          dpkg-deb --contents "${packages[0]}" > "${contents}"
          if rg -q ' \./boot/(vmlinuz|System\.map|config)-' "${contents}"; then
            echo "FATAL: package must not own versioned files under /boot" >&2
            exit 1
          fi
          image_path="$(
            dpkg-deb --fsys-tarfile "${packages[0]}" \
              | tar -t --wildcards './usr/lib/proxmox-kernel/*/Image'
          )"
          if [ -z "${image_path}" ] || [ "$(printf '%s\n' "${image_path}" | wc -l)" -ne 1 ]; then
            echo "FATAL: expected one raw ARM64 Image in the package" >&2
            exit 1
          fi
          image_file="$(mktemp)"
          trap 'rm -f "${contents}" "${image_file}"' EXIT
          dpkg-deb --fsys-tarfile "${packages[0]}" \
            | tar -xOf - "${image_path}" > "${image_file}"
          image_magic="$(
            dd if="${image_file}" bs=1 skip=56 count=4 status=none \
              | od -An -tx1 \
              | tr -d '[:space:]'
          )"
          if [ "${image_magic}" != "41524d64" ]; then
            echo "FATAL: packaged raw ARM64 Image is missing or has invalid ARMd magic" >&2
            exit 1
          fi

  publish:
    needs: [resolve, preflight, build, validate]
    if: ${{ needs.resolve.outputs.build == 'true' && needs.preflight.result == 'success' && needs.build.result == 'success' && needs.validate.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download kernel package
        uses: actions/download-artifact@v8
        with:
          name: pve-kernel-${{ needs.resolve.outputs.pve_version }}-arm64
          path: kernel

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PVE_VERSION="${{ needs.resolve.outputs.pve_version }}"
          FORCE="${{ needs.resolve.outputs.force }}"
          shopt -s nullglob
          packages=(kernel/proxmox-kernel-"${PVE_VERSION}"_*_arm64.deb)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "FATAL: expected one ARM64 kernel package to publish" >&2
            exit 1
          fi
          notes="${RUNNER_TEMP}/kernel-release-notes.md"
          cat > "${notes}" <<'EOF'
          Custom ARM64 Proxmox VE kernel for the X96 Max+.

          - Board: AMedia X96 Max+ / Amlogic S905X3
          - Includes the X96 Max+ device tree and U-Boot boot deployment support
          - Install with: `apt install ./proxmox-kernel-*_arm64.deb`
          EOF

          tag_exists=0
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${PVE_VERSION}" >/dev/null 2>&1; then
            tag_exists=1
          fi
          release_id=""
          release_draft=""
          release_published=0
          if release_state="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PVE_VERSION}" --jq '[.id, .draft, .published_at] | @tsv' 2>/dev/null)"; then
            IFS=$'\t' read -r release_id release_draft published_at <<<"${release_state}"
            if [ "${release_draft}" = false ] && [ "${published_at}" != null ]; then
              release_published=1
            fi
          fi

          if [ "${FORCE}" != "1" ] && [ "${tag_exists}" = "1" ] && [ "${release_published}" = "1" ]; then
            echo "::notice:: ${PVE_VERSION} was published while this build ran; leaving it unchanged."
            exit 0
          fi

          if [ -z "${release_id}" ]; then
            if [ "${tag_exists}" = "1" ]; then
              gh release create "${PVE_VERSION}" "${packages[0]}" \
                --repo "${GITHUB_REPOSITORY}" \
                --verify-tag \
                --title "${PVE_VERSION}" \
                --notes-file "${notes}"
            else
              gh release create "${PVE_VERSION}" "${packages[0]}" \
                --repo "${GITHUB_REPOSITORY}" \
                --target "${GITHUB_SHA}" \
                --title "${PVE_VERSION}" \
                --notes-file "${notes}"
            fi
            exit 0
          fi

          asset_name="${packages[0]##*/}"
          asset_exists=0
          while IFS= read -r name; do
            if [ "${name}" = "${asset_name}" ]; then
              asset_exists=1
              break
            fi
          done < <(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --paginate --jq '.[].name')

          if [ "${FORCE}" = "1" ]; then
            gh release upload "${PVE_VERSION}" "${packages[0]}" --repo "${GITHUB_REPOSITORY}" --clobber
          elif [ "${asset_exists}" = "0" ]; then
            gh release upload "${PVE_VERSION}" "${packages[0]}" --repo "${GITHUB_REPOSITORY}"
          fi

          if [ "${release_draft}" = true ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f name="${PVE_VERSION}" \
              -F body=@"${notes}" \
              -F draft=false >/dev/null
          fi
